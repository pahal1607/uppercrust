<meta name="description" content="Order fresh cakes, pastries and bakery items online from Upper Crust, Swarup Nagar, Kanpur.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body>
<div id="splash"><div><div class="logo-dot">Upper<br>Crust</div><div class="dots"><i></i><i></i><i></i></div></div></div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const GR=[['#fde3c4','#f0b17a'],['#f6d3c4','#e39a7d'],['#e9dcc4','#c9a56f'],['#f3d9d9','#d89a9a'],['#e3ead0','#b9c98a']];
const grad=s=>{const g=GR[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%GR.length];return{'--c1':g[0],'--c2':g[1]}};
const Pic=({src,emoji,seed,cls=''})=>(<div className={'pic '+cls} style={grad(seed||emoji)}>{src?<img src={src} alt="" loading="lazy"/>:<span>{emoji||'🎂'}</span>}</div>);
const Veg=({v})=>(<i className={'vg'+(v===false?' nv':'')}/>);
const price=(p)=>p.weights?.length?Math.min(...p.weights.map(w=>w.price)):p.price;

function Count({to}){const[n,setN]=useState(0);useEffect(()=>{let s=null,id;const f=t=>{s=s||t;const p=Math.min((t-s)/1400,1);setN(Math.round(to*(1-Math.pow(1-p,3))));p<1&&(id=requestAnimationFrame(f))};id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id)},[to]);return n}
function confetti(){const c=['#b5481f','#ffd23f','#ff5d8f','#3bceac','#5b8def','#fff'];for(let i=0;i<70;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%6]};animation-duration:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.5}s;transform:rotate(${Math.random()*360}deg)`;document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function Typed({text}){const[n,setN]=useState(0);useEffect(()=>{setN(0);const t=setInterval(()=>setN(x=>x>=text.length?(clearInterval(t),x):x+1),65);return()=>clearInterval(t)},[text]);return<>{text.slice(0,n)}<span className="caret"/></>}

function Card({p,open,add}){return(
<div className="card" onClick={()=>open(p)}>
 {p.bestseller&&<span className="best">★ Bestseller</span>}
 <Pic src={p.image} emoji={p.emoji} seed={p.id}/>
 <div className="bd"><div style={{display:'flex',gap:7,alignItems:'center'}}><Veg v={p.veg}/><h3>{p.name}</h3></div><div className="ds">{p.desc}</div>
  <div className="pr"><b>{p.weights?.length?'from ':''}{money(price(p))}</b>
  <button className="btn sm" onClick={e=>{e.stopPropagation();(p.weights?.length||p.flavours?.length)?open(p):add(p)}}>Add +</button></div></div></div>)}

function Hero({banners,s}){
 const slides=[{main:1},...banners.filter(b=>b.active!==false)];const[i,setI]=useState(0);
 useEffect(()=>{const t=setInterval(()=>setI(x=>(x+1)%slides.length),6500);return()=>clearInterval(t)},[slides.length]);
 const b=slides[i];
 return(<div className="hero">{[...Array(9)].map((_,k)=><i key={k} className="spk" style={{left:(k*11+4)+'%',animationDelay:(k*.7)+'s',fontSize:12+k%3*7}}>{['✨','🍰','🍓','🍫','⭐'][k%5]}</i>)}<div className="wrap" style={{position:'relative'}}>
 <button className="arrow" style={{left:0}} onClick={()=>setI((i-1+slides.length)%slides.length)}>‹</button>
 <button className="arrow" style={{right:0}} onClick={()=>setI((i+1)%slides.length)}>›</button>
 {b.main?<div className="slide" key="m"><div><span className="chip">🎉 Free delivery on orders above {money(s.freeDeliveryAbove)}</span>
   <h1>Freshly Baked <em><Typed text="Happiness"/></em></h1><p>{s.tagline}. Cakes, pastries & treats made with love in Swarup Nagar — delivered fresh to your doorstep.</p>
   <a href="#/menu/cakes" className="btn">Order Online →</a> <a href="#/menu/cakes" className="btn out" style={{marginLeft:10}}>View Menu</a>
   <div className="stats"><div><b><Count to={35}/>+</b><span>Years</span></div><div><b><Count to={100}/>+</b><span>Varieties</span></div><div><b><Count to={10}/>K+</b><span>Happy Customers</span></div></div></div>
   <div className="himg"><div className="pic" style={{...grad('hero'),fontSize:150}}>{s.heroImage?<img src={s.heroImage} alt=""/>:<span>🎂</span>}</div><div className="tag t1">✓ 100% Fresh</div><div className="tag t2" style={{animationDelay:'.3s'}}>⭐ 4.4 Rating</div></div></div>
  :<div className="banner" key={b.id}><div><h2 className="serif">{b.title}</h2><p>{b.subtitle}</p><a href={b.link||'#/menu/cakes'} className="btn">{b.cta||'Order Now'}</a></div>
   <div className="himg" style={{fontSize:160}}>{b.image?<img src={b.image} style={{maxHeight:340,borderRadius:24,maxWidth:'80vw'}}/>:b.emoji}</div></div>}
 <div className="dotsnav">{slides.map((_,k)=><i key={k} className={k===i?'on':''} onClick={()=>setI(k)}/>)}</div></div></div>)}

function Home({d,open,add}){
 const cats=d.categories,act=d.products.filter(p=>p.active!==false);
 return(<>
 <Hero banners={d.banners} s={d.settings}/>
 <div className="wrap feat rv">{[['🚚','Free Delivery','On orders over '+money(d.settings.freeDeliveryAbove)],['⏰','Same Day Delivery','Order today, get today'],['✨','100% Quality','Premium ingredients'],['❤️','Made with Love','Since 1989']].map(f=><div key={f[1]}><i>{f[0]}</i><p><b>{f[1]}</b><span>{f[2]}</span></p></div>)}</div>
 <div className="strip"><div>{[...Array(2)].map((_,k)=><span key={k}>{['Black Forest','Truffle','Butterscotch','Pineapple','Red Velvet','Kitkat','Oreo','Eggless','Wedding Cakes','Fresh Pastries','Cookies','Patties'].map(x=><b key={x}>✦ {x}</b>)}</span>)}</div></div>
 <section><div className="wrap"><div className="sh rv"><div><h2>Our Menu</h2><p>Explore our freshly baked delights</p></div><a className="btn sm" href={'#/menu/'+(cats[0]?.id||'')}>View All →</a></div>
  <div className="cats">{cats.map((c,k)=><a key={c.id} href={'#/menu/'+c.id} className="cat rv" style={{transitionDelay:k*70+'ms'}}><Pic emoji={c.emoji} seed={c.id} src={c.image||act.find(p=>p.category===c.id&&p.image)?.image}/>{c.name}</a>)}</div></div></section>
 {cats.map((c,k)=>{const ps=act.filter(p=>p.category===c.id).slice(0,4);return ps.length?<section key={c.id} className={k%2?'':'tint'}><div className="wrap"><div className="sh rv"><div><h2>{c.name}</h2><p>Explore our finest collection</p></div><a className="btn sm" href={'#/menu/'+c.id}>View All →</a></div>
  <div className="grid">{ps.map((p,j)=><div key={p.id} className="rv" style={{transitionDelay:j*80+'ms',display:'flex'}}><div style={{flex:1,display:'flex'}}><Card p={p} open={open} add={add}/></div></div>)}</div></div></section>:null})}
 <section><div className="wrap"><div className="sh rv" style={{display:'block',textAlign:'center'}}><h2 style={{}}>Shop by Occasion</h2><p>From birthdays to weddings, we craft memories that last a lifetime.</p></div>
  <div className="occ">{d.occasions.map((o,k)=><a key={o.id} href={o.link} className="oc rv" style={{transitionDelay:k*90+'ms',...grad(o.id)}}><div className="bg">{o.image?<img src={o.image}/>:o.emoji}</div><small>{o.sub}</small><h3>{o.name}</h3></a>)}</div></div></section>
 {d.offers.some(o=>o.active)&&<section className="offers"><div className="wrap"><h2 className="rv">Special Offers Just For You</h2><p className="rv">Save big on your favourite treats</p>
  <div className="og">{d.offers.filter(o=>o.active).map(o=><div className="of rv" key={o.id}><span className="bg2">{o.badge}</span><span className="chip" style={{margin:0,boxShadow:'none',background:'var(--soft)',color:'var(--pri)'}}>{o.tag}</span><h4>{o.title}</h4>
   <div className="code">{o.code}<button className="btn sm" onClick={()=>{navigator.clipboard?.writeText(o.code);window.toast('Code '+o.code+' copied!')}}>Copy</button></div><p style={{fontSize:12,color:'var(--mut)',marginTop:10}}>Min order {money(o.min)}{o.max?` · Save up to ${money(o.max)}`:''}</p></div>)}</div></div></section>}
 <section><div className="wrap"><div className="sh rv" style={{display:'block',textAlign:'center'}}><h2>Why Upper Crust</h2><p>Trusted by Kanpur since 1989</p></div>
  <div className="trust">{[['🛡️','Premium Quality','Only the finest ingredients'],['⚡','Same Day Delivery','Order early for same-day'],['🎨','Custom Designs','Personalised for your moment'],['😊','100% Satisfaction',"Not happy? We'll make it right"]].map((t,k)=><div className="rv" style={{transitionDelay:k*90+'ms'}} key={t[1]}><i>{t[0]}</i><h3 style={{font:'600 15px Poppins'}}>{t[1]}</h3><p>{t[2]}</p></div>)}</div></div></section>
 <section className="tint"><div className="wrap rv" style={{textAlign:'center'}}><h2 style={{fontSize:30}}>Visit Us in Swarup Nagar</h2><p style={{color:'var(--mut)',margin:'10px 0 20px'}}>{d.settings.address}<br/>{d.settings.hours}</p>
  <a className="btn" target="_blank" href={'https://www.google.com/maps/search/'+encodeURIComponent('Upper Crust '+d.settings.address)}>📍 Get Directions</a></div></section></>)}

function Menu({d,cat,open,add,cart,go}){
 const cats=d.categories,c=cats.find(x=>x.id===cat)||cats[0],ps=d.products.filter(p=>p.active!==false&&p.category===c?.id);
 const[f,setF]=useState('all'),list=ps.filter(p=>f==='all'||(f==='veg')===(p.veg!==false));
 const n=cart.reduce((a,i)=>a+i.qty,0),t=cart.reduce((a,i)=>a+i.qty*i.price,0);
 return(<><div className="mhero"><div className="wrap"><div className="crumb" style={{textAlign:'left'}}><a href="#/">Home</a> › Menu</div><span className="chip">EXPLORE OUR COLLECTION</span><h1>Upper Crust <em>Menu</em></h1></div></div>
 <div className="wrap mlay"><aside className="side"><h4>☰ Menu</h4>{cats.map(x=><a key={x.id} href={'#/menu/'+x.id} className={x.id===c?.id?'on':''}><span>{x.emoji}</span>{x.name}<em>({d.products.filter(p=>p.category===x.id&&p.active!==false).length})</em></a>)}</aside>
 <div><div style={{display:'flex',gap:10,marginBottom:14}}>{[['all','All'],['veg','🟢 Veg'],['nonveg','🔴 Non-Veg']].map(([k,l])=><button key={k} className={'pill'+(f===k?' on':'')} onClick={()=>setF(k)}>{l}</button>)}</div>
  <h2 className="serif" style={{textAlign:'center',margin:'6px 0 20px',fontSize:30}}><span style={{color:'var(--pri)'}}>{c?.name}</span></h2>
  <div className="hz" key={c?.id+f}>{list.map((p,j)=><div key={p.id} style={{animation:`pop .4s ${j*50}ms both`,display:'flex'}}><div style={{flex:1,display:'flex'}}><Card p={p} open={open} add={add}/></div></div>)}{!list.length&&<p style={{color:'var(--mut)'}}>Nothing here yet.</p>}</div></div></div>
 {n>0&&<div className="cartbar" onClick={()=>window.openCart()} style={{cursor:'pointer'}}><span>{money(t)} | {n} item{n>1?'s':''}</span><span>View Cart →</span></div>}</>)}

function ProductModal({p,close,add}){
 const[w,setW]=useState(p.weights?.[0]?.label||''),[fl,setFl]=useState(p.flavours?.[0]||''),[msg,setMsg]=useState(''),pr=p.weights?.find(x=>x.label===w)?.price??p.price;
 return(<div className="ov" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}><button className="x" onClick={close}>✕</button>
 <div className="pm"><Pic src={p.image} emoji={p.emoji} seed={p.id}/><div className="opt"><h2 className="serif" style={{fontSize:26}}><Veg v={p.veg}/> {p.name}</h2><p style={{color:'var(--mut)',fontSize:13.5,margin:'8px 0'}}>{p.desc}</p>
  {!!p.flavours?.length&&<><label>Flavour *</label><div className="pills">{p.flavours.map(x=><button key={x} className={'pill'+(fl===x?' on':'')} onClick={()=>setFl(x)}>{x}</button>)}</div></>}
  {!!p.weights?.length&&<><label>Weight / Size *</label><div className="pills">{p.weights.map(x=><button key={x.label} className={'pill'+(w===x.label?' on':'')} onClick={()=>setW(x.label)}>{x.label}</button>)}</div></>}
  {p.category!=='savouries'&&<><label>Message on Cake</label><div className="pills" style={{marginBottom:8}}>{['Happy Birthday','Anniversary','Congratulations'].map(x=><button key={x} className="pill" onClick={()=>setMsg(x)}>{x}</button>)}</div><input className="inp" maxLength={30} value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Enter your message (max 30 characters)"/><small style={{color:'var(--mut)'}}>{msg.length}/30</small></>}
  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:22}}><b style={{fontSize:24,color:'var(--pri)'}}>{money(pr)}</b><div style={{display:'flex',gap:8}}><button className="btn out" onClick={()=>{add(p,{weight:w,flavour:fl,message:msg,price:pr});close()}}>Add to Cart</button><button className="btn" onClick={()=>{add(p,{weight:w,flavour:fl,message:msg,price:pr},true);close()}}>Checkout</button></div></div></div></div></div></div>)}

function LocModal({close,areas,set}){const[m,setM]=useState(false),[v,setV]=useState('');
 return(<div className="ov" onClick={close}><div className="modal sm" onClick={e=>e.stopPropagation()}><button className="x" onClick={close}>✕</button><div className="lhead"><h3 style={{font:'600 19px Poppins'}}>📍 Where should we deliver?</h3><small>Fresh cakes delivered to your doorstep</small></div>
 <div style={{padding:20}}><button className="lopt" onClick={()=>{set('Swarup Nagar');close()}}><span>🎯</span><span><b>Use my current location</b><br/><small style={{color:'var(--mut)'}}>Fastest way to get started</small></span></button>
 {m?<div style={{display:'flex',gap:8,marginBottom:10}}><input autoFocus className="inp" placeholder="Area, landmark or pincode" value={v} onChange={e=>setV(e.target.value)}/><button className="btn sm" onClick={()=>{v&&set(v);close()}}>Go</button></div>:<button className="lopt" onClick={()=>setM(true)}><span>🔍</span><span><b>Enter location manually</b><br/><small style={{color:'var(--mut)'}}>Type your area, landmark or pincode</small></span></button>}
 <p style={{textAlign:'center',color:'var(--mut)',fontSize:12,margin:'14px 0'}}>— or select an area —</p><div className="pills">{areas.map(a=><button key={a} className="pill" onClick={()=>{set(a);close()}}>{a}</button>)}</div></div></div></div>)}

function Cart({cart,setCart,d,close,checkout}){
 const sub=cart.reduce((a,i)=>a+i.qty*i.price,0),del=sub>=d.settings.freeDeliveryAbove||!sub?0:50;
 const q=(k,dl)=>setCart(c=>c.map(i=>i.key===k?{...i,qty:i.qty+dl}:i).filter(i=>i.qty>0));
 return(<><div className="ov" onClick={close} style={{zIndex:100}}/><div className="drawer"><header><span>🛒 Your Cart</span><button onClick={close}>✕</button></header>
 <div className="ditems">{!cart.length&&<p style={{textAlign:'center',margin:'60px 0',color:'var(--mut)'}}><span style={{fontSize:60,display:'block'}}>🧁</span>Your cart is empty</p>}
 {cart.map(i=><div className="ci" key={i.key}><Pic src={i.image} emoji={i.emoji} seed={i.id}/><div style={{flex:1}}><b style={{fontSize:14}}>{i.name}</b><div style={{fontSize:12,color:'var(--mut)'}}>{[i.weight,i.flavour,i.message&&`“${i.message}”`].filter(Boolean).join(' · ')}</div><div className="qty"><button onClick={()=>q(i.key,-1)}>−</button><span>{i.qty}</span><button onClick={()=>q(i.key,1)}>+</button></div></div><b>{money(i.price*i.qty)}</b></div>)}</div>
 {!!cart.length&&<div className="dfoot"><div className="row"><span>Subtotal</span><span>{money(sub)}</span></div><div className="row"><span>Delivery</span><span>{del?money(del):'FREE'}</span></div>{del>0&&<small style={{color:'var(--pri)'}}>Add {money(d.settings.freeDeliveryAbove-sub)} more for free delivery</small>}<div className="row t"><span>Total</span><span>{money(sub+del)}</span></div><button className="btn" style={{width:'100%',marginTop:12}} onClick={checkout}>Proceed to Checkout →</button></div>}</div></>)}

function Checkout({cart,d,close,done,user,login}){
 const[f,setF]=useState({name:user?.name||'',phone:user?.phone||'',address:'',area:'',date:'',slot:'10 AM – 1 PM',note:''}),[code,setCode]=useState(''),[disc,setDisc]=useState(0),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
 const sub=cart.reduce((a,i)=>a+i.qty*i.price,0),del=sub>=d.settings.freeDeliveryAbove?0:50,set=k=>e=>setF({...f,[k]:e.target.value});
 const apply=async()=>{const r=await fetch('/api/validate-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,sub})}),j=await r.json();r.ok?(setDisc(j.discount),setErr('')):(setDisc(0),setErr(j.error))};
 const place=async()=>{setBusy(true);const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','x-user-token':localStorage.uc_user||''},body:JSON.stringify({...f,code:disc?code:'',items:cart.map(i=>({id:i.id,qty:i.qty,weight:i.weight,flavour:i.flavour,message:i.message}))})}),j=await r.json();setBusy(false);r.ok?done(j):setErr(j.error)};
 return(<div className="ov" onClick={close}><div className="modal sm" style={{width:'min(520px,100%)'}} onClick={e=>e.stopPropagation()}><button className="x" onClick={close}>✕</button><div className="lhead"><h3 style={{font:'600 19px Poppins'}}>Checkout</h3><small>Pay on delivery · we'll confirm on call/WhatsApp</small></div>{!user&&<p style={{background:'var(--soft)',padding:'9px 20px',fontSize:13}}>Have an account? <a href="#" style={{color:'var(--pri)',fontWeight:600}} onClick={e=>{e.preventDefault();login()}}>Log in</a> to track this order.</p>}
 <div style={{padding:20,display:'grid',gap:10}}><input className="inp" placeholder="Your name *" value={f.name} onChange={set('name')}/><input className="inp" placeholder="Mobile number *" inputMode="numeric" value={f.phone} onChange={set('phone')}/>
 <select className="inp" value={f.area} onChange={set('area')}><option value="">Select area</option>{d.settings.areas.map(a=><option key={a}>{a}</option>)}</select><textarea className="inp" rows={2} placeholder="Full delivery address *" value={f.address} onChange={set('address')}/>
 <div style={{display:'flex',gap:10}}><input className="inp" type="date" min={new Date().toISOString().slice(0,10)} value={f.date} onChange={set('date')}/><select className="inp" value={f.slot} onChange={set('slot')}>{['10 AM – 1 PM','1 PM – 4 PM','4 PM – 7 PM','7 PM – 10 PM','Midnight (11:30 PM)'].map(s=><option key={s}>{s}</option>)}</select></div>
 <div style={{display:'flex',gap:8}}><input className="inp" placeholder="Promo code" value={code} onChange={e=>setCode(e.target.value.toUpperCase())}/><button className="btn sm" onClick={apply}>Apply</button></div>
 {err&&<small style={{color:'#c9302c'}}>{err}</small>}
 <div className="row"><span>Subtotal</span><span>{money(sub)}</span></div>{disc>0&&<div className="row" style={{color:'var(--ok)'}}><span>Discount</span><span>−{money(disc)}</span></div>}<div className="row"><span>Delivery</span><span>{del?money(del):'FREE'}</span></div><div className="row t"><span>Total</span><span>{money(sub-disc+del)}</span></div>
 <button className="btn" disabled={busy} onClick={place}>{busy?'Placing…':'Place Order'}</button></div></div></div>)}

  if(tab==='a'){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:f.password})}),j=await r.json();if(!r.ok)throw new Error(j.error);localStorage.uc_admin=j.token;location.href='/admin';return}
  const r=await fetch(reg?'/api/register':'/api/user-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)}),j=await r.json();if(!r.ok)throw new Error(j.error);
  localStorage.uc_user=j.token;onUser({name:j.name,phone:j.phone});window.toast('Welcome, '+j.name.split(' ')[0]+'! 🎉');close()}catch(x){setErr(x.message)}setBusy(false)};
 return(<div className="ov" onClick={close}><div className="modal sm" onClick={e=>e.stopPropagation()}><button className="x" onClick={close}>✕</button>
