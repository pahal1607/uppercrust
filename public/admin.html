<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upper Crust · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<style>body{background:#faf5ef}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.nav{background:var(--dark);color:#e8d3bf;padding:20px 12px;position:sticky;top:0;height:100vh}.nav .brand{color:#fff;padding:0 10px 20px}.nav button{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:4px;transition:.2s}.nav button:hover{background:rgba(255,255,255,.08)}.nav button.on{background:var(--pri);color:#fff}
.main{padding:28px;animation:fadeIn .3s}.tb{background:#fff;border-radius:14px;box-shadow:var(--sh);overflow:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;padding:12px 14px;background:#fbf2e8;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:#fffaf4}
.th{width:42px;height:42px;border-radius:8px;object-fit:cover;display:grid;place-items:center;background:var(--soft);font-size:20px}.st{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft)}.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:22px}.fg2 label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:5px}.fg2 .full{grid-column:1/-1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}.stat{background:#fff;border-radius:14px;padding:18px;box-shadow:var(--sh)}.stat b{font:700 28px 'Playfair Display';color:var(--pri);display:block}
.lg{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#d9692f,#6d2610)}.lg form{background:#fff;padding:36px;border-radius:20px;width:min(380px,92vw);display:grid;gap:14px;animation:pop .4s}
@media(max-width:760px){.shell{grid-template-columns:1fr}.nav{position:static;height:auto;display:flex;overflow:auto;padding:8px}.nav .brand{display:none}.nav button{width:auto;white-space:nowrap}.fg2{grid-template-columns:1fr}}</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
let TOKEN=localStorage.uc_admin||'';
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('uc_admin');location.reload()}if(!r.ok)throw new Error(j.error||'Error');return j};
const toList=s=>String(s).split(',').map(x=>x.trim()).filter(Boolean);
const wStr=a=>(a||[]).map(w=>w.label+'='+w.price).join(', '),wParse=s=>toList(s).map(x=>{const[l,p]=x.split('=');return{label:l.trim(),price:+p}}).filter(w=>w.label&&w.price>=0);
const SCHEMA={
 products:[['name','Name','text'],['category','Category','cat'],['price','Base price (₹)','number'],['emoji','Emoji (if no photo)','text'],['image','Photo','image'],['desc','Description','area'],['weights','Sizes & prices  (e.g. 500 g=650, 1 kg=1200)','weights'],['flavours','Flavours (comma separated)','list'],['veg','Vegetarian','check'],['bestseller','Bestseller badge','check'],['active','Visible on website','check']],
 categories:[['name','Name','text'],['emoji','Emoji','text'],['image','Photo','image']],
 offers:[['tag','Label','text'],['badge','Badge (e.g. 10% OFF)','text'],['title','Offer text','area'],['code','Promo code','text'],['percent','Percent off (0 for flat)','number'],['flat','Flat ₹ off','number'],['min','Minimum order ₹','number'],['max','Max discount ₹','number'],['active','Active','check']],
 banners:[['title','Title','text'],['subtitle','Subtitle','text'],['cta','Button text','text'],['link','Button link (e.g. #/menu/cakes)','text'],['emoji','Emoji (if no photo)','text'],['image','Banner photo','image'],['active','Active','check']],
 occasions:[['name','Name','text'],['sub','Small text','text'],['link','Link (e.g. #/menu/custom)','text'],['emoji','Emoji','text'],['image','Photo','image']]};
const TITLES={products:'Products',categories:'Categories',offers:'Offers & Coupons',banners:'Home Banners',occasions:'Occasions'};
const ICON={dash:'📊',orders:'📦',products:'🎂',categories:'🗂️',offers:'🏷️',banners:'🖼️',occasions:'🎈',settings:'⚙️'};

function Login({ok}){const[p,setP]=useState(''),[e,setE]=useState('');return(<div className="lg"><form onSubmit={async x=>{x.preventDefault();try{const j=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})}).then(r=>r.ok?r.json():Promise.reject());TOKEN=j.token;localStorage.uc_admin=TOKEN;ok()}catch{setE('Wrong password')}}}>
 <div className="brand" style={{textAlign:'center',fontSize:30}}>Upper Crust<small>ADMIN PANEL</small></div><input className="inp" type="password" placeholder="Admin password" value={p} onChange={x=>setP(x.target.value)} autoFocus/>{e&&<small style={{color:'#c9302c'}}>{e}</small>}<button className="btn">Log in</button></form></div>)}

function ImgField({v,on}){const up=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{on((await api('/api/admin/upload','POST',{data:r.result})).url)}catch(x){alert(x.message)}};r.readAsDataURL(f)};
 return(<div style={{display:'flex',gap:10,alignItems:'center'}}>{v?<img className="th" src={v}/>:<span className="th">📷</span>}<input type="file" accept="image/*" onChange={up}/>{v&&<button type="button" onClick={()=>on('')} style={{color:'#c9302c',fontSize:12}}>Remove</button>}</div>)}

function Form({col,item,cats,save,close}){
 const[f,setF]=useState(()=>({...item,weights:item.weights?wStr(item.weights):'',flavours:(item.flavours||[]).join(', ')}));const s=k=>v=>setF(x=>({...x,[k]:v}));
 return(<div className="ov" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}><button className="x" onClick={close}>✕</button><h3 className="serif" style={{padding:'22px 22px 0',fontSize:22}}>{item.id?'Edit':'Add'} {TITLES[col].replace(/s$/,'')}</h3>
 <div className="fg2">{SCHEMA[col].map(([k,l,t])=><div key={k} className={['area','image','weights'].includes(t)?'full':''}>{t==='check'?<label style={{display:'flex',gap:8,alignItems:'center',fontSize:14,color:'var(--ink)'}}><input type="checkbox" checked={f[k]!==false&&!!f[k]||(f[k]===undefined&&k==='active')} onChange={e=>s(k)(e.target.checked)}/>{l}</label>:<><label>{l}</label>
  {t==='cat'?<select className="inp" value={f[k]||''} onChange={e=>s(k)(e.target.value)}><option value="">Choose…</option>{cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>:t==='area'?<textarea className="inp" rows={2} value={f[k]||''} onChange={e=>s(k)(e.target.value)}/>:t==='image'?<ImgField v={f[k]} on={s(k)}/>:<input className="inp" type={t==='number'?'number':'text'} value={f[k]??''} onChange={e=>s(k)(t==='number'?+e.target.value:e.target.value)}/>}</>}</div>)}</div>
 <div style={{padding:'0 22px 22px',textAlign:'right'}}><button className="btn" onClick={()=>save({...f,weights:wParse(f.weights||''),flavours:toList(f.flavours||''),...(col==='products'?{price:+f.price||0}:{})})}>Save</button></div></div></div>)}

function Table({col,data,cats,reload}){
 const[ed,setEd]=useState(null),rows=data[col];const cn=id=>cats.find(c=>c.id===id)?.name||'—';
 const save=async f=>{try{f.id?await api(`/api/admin/${col}/${f.id}`,'PUT',f):await api(`/api/admin/${col}`,'POST',f);setEd(null);reload()}catch(e){alert(e.message)}};
 const del=async r=>{if(confirm('Delete "'+(r.name||r.title||r.code)+'"?')){await api(`/api/admin/${col}/${r.id}`,'DELETE');reload()}};
 const tog=async(r,k)=>{await api(`/api/admin/${col}/${r.id}`,'PUT',{...r,[k]:r[k]===false});reload()};
 return(<><div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}><h2 className="serif">{TITLES[col]}</h2><button className="btn sm" onClick={()=>setEd(col==='products'?{veg:true,active:true,category:cats[0]?.id}:{active:true})}>+ Add new</button></div>
 <div className="tb"><table><thead><tr><th></th><th>{col==='offers'?'Code':'Name'}</th>{col==='products'&&<><th>Category</th><th>Price</th></>}{col==='offers'&&<th>Offer</th>}{['products','offers','banners'].includes(col)&&<th>Visible</th>}<th></th></tr></thead><tbody>
 {rows.map(r=><tr key={r.id}><td>{r.image?<img className="th" src={r.image}/>:<span className="th">{r.emoji||'🏷️'}</span>}</td><td><b>{r.name||r.title||r.code}</b></td>{col==='products'&&<><td>{cn(r.category)}</td><td>{r.weights?.length?'from '+money(Math.min(...r.weights.map(w=>w.price))):money(r.price)}</td></>}{col==='offers'&&<td>{r.badge}</td>}
  {['products','offers','banners'].includes(col)&&<td><button className="st" style={{background:r.active===false?'#eee':'#dff3e5',color:r.active===false?'#888':'#1f7a40'}} onClick={()=>tog(r,'active')}>{r.active===false?'Hidden':'Live'}</button></td>}
  <td style={{textAlign:'right',whiteSpace:'nowrap'}}><button className="btn out sm" onClick={()=>setEd(r)}>Edit</button> <button className="btn out sm" style={{color:'#c9302c',borderColor:'#c9302c'}} onClick={()=>del(r)}>Delete</button></td></tr>)}</tbody></table></div>
 {ed&&<Form col={col} item={ed} cats={cats} save={save} close={()=>setEd(null)}/>}</>)}

const ST=['New','Confirmed','Baking','Out for delivery','Delivered','Cancelled'];
function Orders(){const[o,setO]=useState(null);const load=()=>api('/api/admin/orders').then(setO);useEffect(()=>{load();const t=setInterval(load,15000);return()=>clearInterval(t)},[]);if(!o)return null;
 return(<><h2 className="serif" style={{marginBottom:16}}>Orders <small style={{fontSize:13,color:'var(--mut)'}}>(auto-refreshes)</small></h2>{!o.length&&<p style={{color:'var(--mut)'}}>No orders yet.</p>}
 <div style={{display:'grid',gap:14}}>{o.map(x=><div key={x.id} className="stat" style={{animation:'pop .3s'}}><div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}}><b style={{fontSize:16}}>#{x.id} · {x.name}</b><select className="inp" style={{width:'auto'}} value={x.status} onChange={async e=>{await api('/api/admin/orders/'+x.id,'PATCH',{status:e.target.value});load()}}>{ST.map(s=><option key={s}>{s}</option>)}</select></div>
  <p style={{fontSize:13,color:'var(--mut)',margin:'6px 0'}}>📞 <a href={'tel:'+x.phone}>{x.phone}</a> · 📍 {x.address}{x.area&&', '+x.area} · 🗓 {x.date||'ASAP'} {x.slot} · {new Date(x.createdAt).toLocaleString('en-IN')}</p>
  <ul style={{fontSize:13.5,paddingLeft:18}}>{x.items.map((i,k)=><li key={k}>{i.qty}× {i.name} {[i.weight,i.flavour,i.message&&`“${i.message}”`].filter(Boolean).join(' · ')} — {money(i.price*i.qty)}</li>)}</ul>
  <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}><b style={{color:'var(--pri)'}}>Total {money(x.total)}{x.code&&` (code ${x.code})`}</b><button style={{color:'#c9302c',fontSize:12}} onClick={async()=>{if(confirm('Delete order?')){await api('/api/admin/orders/'+x.id,'DELETE');load()}}}>Delete</button></div></div>)}</div></>)}

function Settings({data,reload}){const[s,setS]=useState({...data.settings,areas:data.settings.areas.join(', ')}),[m,setM]=useState('');const k=x=>({value:s[x]??'',onChange:e=>setS({...s,[x]:e.target.value}),className:'inp'});
 return(<><h2 className="serif" style={{marginBottom:16}}>Shop Settings</h2><div className="tb"><div className="fg2">{[['name','Shop name'],['tagline','Tagline'],['phone','Phone number'],['whatsapp','WhatsApp number (with 91, no +)'],['hours','Opening hours'],['freeDeliveryAbove','Free delivery above ₹'],['address','Address','full'],['announcement','Top announcement bar','full'],['areas','Delivery areas (comma separated)','full']].map(([x,l,c])=><div key={x} className={c}><label>{l}</label><input {...k(x)}/></div>)}
 <div className="full"><button className="btn" onClick={async()=>{await api('/api/admin/settings','PUT',{...s,freeDeliveryAbove:+s.freeDeliveryAbove,areas:toList(s.areas)});setM('Saved ✓');reload()}}>Save settings</button> <b style={{color:'var(--ok)',marginLeft:10}}>{m}</b></div></div></div></>)}

function App(){const[ok,setOk]=useState(!!TOKEN),[tab,setTab]=useState('dash'),[d,setD]=useState(null),[ord,setOrd]=useState([]);
 const reload=()=>fetch('/api/data').then(r=>r.json()).then(setD);useEffect(()=>{if(ok){reload();api('/api/admin/orders').then(setOrd).catch(()=>{})}},[ok,tab]);
 if(!ok)return<Login ok={()=>setOk(true)}/>;if(!d)return null;
 const rev=ord.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+o.total,0);
 return(<div className="shell"><div className="nav"><div className="brand">Upper Crust<small>ADMIN</small></div>{[['dash','Dashboard'],['orders','Orders'],['products','Products'],['categories','Categories'],['offers','Offers'],['banners','Banners'],['occasions','Occasions'],['settings','Settings']].map(([k,l])=><button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)}>{ICON[k]} {l}</button>)}
  <button onClick={()=>window.open('/','_blank')}>🌐 View website</button><button onClick={()=>{localStorage.removeItem('uc_admin');location.reload()}}>🚪 Log out</button></div>
 <div className="main" key={tab}>{tab==='dash'?<><h2 className="serif" style={{marginBottom:16}}>Welcome back 👋</h2><div className="cards">{[['New orders',ord.filter(o=>o.status==='New').length],['Total orders',ord.length],['Revenue',money(rev)],['Products',d.products.length],['Hidden products',d.products.filter(p=>p.active===false).length]].map(([l,v])=><div className="stat" key={l}><b>{v}</b>{l}</div>)}</div><p style={{color:'var(--mut)'}}>Use the menu on the left to manage orders, products, prices, photos, offers and banners. Changes appear on the website instantly.</p></>
  :tab==='orders'?<Orders/>:tab==='settings'?<Settings data={d} reload={reload}/>:<Table col={tab} data={d} cats={d.categories} reload={reload}/>}</div></div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
